name: Build unsigned IPA

# Compila la app companion en un runner macOS GRATUITO de GitHub.
# Produce un .ipa SIN firma; Sideloadly/AltStore lo refirma en tu PC con tu Apple ID.
#
# Se ejecuta en dos situaciones:
#   1. Push a main que modifique companion_ios/ → sube artefacto temporal (90 días)
#   2. Push de un tag v*.*.* → además crea un GitHub Release permanente con el .ipa

on:
  push:
    branches: [ main ]
    paths: [ "companion_ios/**", ".github/workflows/build-ipa.yml" ]
    tags:
      - "v*.*.*"
  workflow_dispatch:   # permite lanzarlo a mano desde la pestaña Actions

jobs:
  build:
    runs-on: macos-15
    permissions:
      contents: write   # necesario para crear GitHub Releases con softprops/action-gh-release
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true   # fuerza Node.js 24 en upload-artifact@v4 (aún no tiene v5)

    steps:
      - name: Checkout
        uses: actions/checkout@v6   # v5 usa Node.js 24 de forma nativa

      - name: Seleccionar Xcode estable más reciente
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)" && xcodebuild -version

      - name: Instalar XcodeGen
        run: brew install xcodegen

      - name: Generar proyecto Xcode
        working-directory: companion_ios
        run: xcodegen generate

      - name: Compilar (sin firma)
        working-directory: companion_ios
        run: |
          set -eo pipefail
          xcodebuild \
            -project PhotoBridge.xcodeproj \
            -scheme PhotoBridgeCompanion \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            clean build

      - name: Empaquetar .ipa
        working-directory: companion_ios
        run: |
          set -eo pipefail
          APP="build/Build/Products/Release-iphoneos/PhotoBridgeCompanion.app"
          if [ ! -d "$APP" ]; then echo "No se encontró el .app"; exit 1; fi
          rm -rf Payload && mkdir Payload
          cp -R "$APP" Payload/
          zip -qr PhotoBridgeCompanion.ipa Payload
          echo "IPA generado:"; ls -lh PhotoBridgeCompanion.ipa

      - name: Subir artefacto (.ipa)
        uses: actions/upload-artifact@v7
        with:
          name: PhotoBridgeCompanion-ipa
          path: companion_ios/PhotoBridgeCompanion.ipa
          if-no-files-found: error

      # Solo en tags v*.*.* → crear GitHub Release permanente
      - name: Crear GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          name: PhotoBridge ${{ github.ref_name }}
          body: |
            ## PhotoBridgeCompanion ${{ github.ref_name }}

            App companion para importar fotos y Live Photos al carrete del iPhone desde Windows vía USB.

            ### Instalación
            1. Descarga `PhotoBridgeCompanion.ipa` (abajo en *Assets*).
            2. Instálalo con **[Sideloadly](https://sideloadly.io)** usando tu Apple ID.
               - El .ipa es **sin firma** — necesitas firmarlo tú con tu Apple ID.
               - Sideloadly hace la firma automáticamente al instalar.
            3. Sigue las instrucciones en [BUILD_AND_SIDELOAD.md](https://github.com/${{ github.repository }}/blob/main/BUILD_AND_SIDELOAD.md).

            ### Notas
            - Compatible con iOS 16+.
            - La app caduca a los 7 días con Apple ID gratuito; reinstala con Sideloadly para renovarla.
            - Mantén la app en primer plano durante la importación desde el PC.
          files: companion_ios/PhotoBridgeCompanion.ipa
          fail_on_unmatched_files: true
